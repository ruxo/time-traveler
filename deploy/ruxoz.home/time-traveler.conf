server {
  rewrite_log off;

  listen 443 ssl;

  charset utf-8;
  server_name time-traveler.ruxoz.net;

  location / {
    proxy_pass http://time-traveler:8080;

    proxy_http_version 1.1;

    # Bylaw 2 bounds a request at 60 s; nginx's own default is exactly 60 s.
    proxy_read_timeout 100s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The app sets the Secure cookie flag and the __Host- cookie names from this header.
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  ssl_certificate /etc/letsencrypt/live/time-traveler.ruxoz.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/time-traveler.ruxoz.net/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  rewrite_log off;

  listen 80;

  charset utf-8;
  server_name time-traveler.ruxoz.net;

  client_max_body_size 1m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

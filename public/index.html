<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Traveler</title>
<meta name="description" content="จดเวลาแบบง่ายๆ ว่าแต่ละวันหมดไปกับอะไร">
<meta name="theme-color" content="#FFF8DC">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Mitr:wght@400;500&family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/theme-init.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>
<div id="app"><p class="wrap muted">กำลังโหลด…</p></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<!-- The glass of the radial menu: smooth noise pushes the pixels behind the disc around, like a thick lens. -->
<svg class="defs" aria-hidden="true">
  <filter id="tt-glass" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence"/>
    <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap"/>
    <feDisplacementMap in="SourceGraphic" in2="softMap" scale="150" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
</body>
</html>
